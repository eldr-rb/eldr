AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - 'db/**/*'
    - 'config/**/*'
    - 'script/**/*'
    - 'Gemfile'
    - 'eldr.gemspec'
    - 'vendor/**/*'
    - 'spec/support/**/*'
    - 'examples/**/*'
    - 'benchmarks/**/*'

plugins:
  - rubocop-rspec

Layout/LineLength:
  Max: 120

Style/AndOr:
  Enabled: false

Style/SignalException:
  Enabled: false

Metrics/AbcSize:
  Max: 40

Metrics/MethodLength:
  Max: 20

Metrics/ClassLength:
  Max: 130

Metrics/ParameterLists:
  Max: 6

Style/Documentation:
  Enabled: false

RSpec/DescribeClass:
  Exclude:
    - 'spec/examples/**/*'
    - 'spec/readme_spec.rb'

inherit_from: .rubocop_todo.yml